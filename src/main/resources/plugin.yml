name: SmartSpawner
version: 1.1.0
main: net.ludovicoflaviano.smartspawner.SmartSpawnerPlugin
api-version: '1.21'
author: ludovico-flaviano-netizen
description: Smart virtual-storage spawners with detected mob types, clean upgrade branches and Vault economy.
depend: [Vault]
softdepend: [EconomyShopGUI]
commands:
  smartspawner:
    description: Manage SmartSpawner items.
    usage: /smartspawner give <player> <entity> [amount]
    aliases: [ss]
permissions:
  smartspawner.admin:
    description: Allows SmartSpawner administration commands.
    default: op
